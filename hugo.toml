baseURL = "https://leetaek.github.io/"
languageCode = "ko-kr"
title = "iOS 개발 기록"
theme = "PaperMod"
hasCJKLanguage = true

[pagination]
  pagerSize = 10

# 검색 페이지(/search/)가 읽는 색인(index.json)을 함께 만든다.
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 옮겨 온 글의 gist 임베드(<script>)를 그대로 내보낸다.
[markup.goldmark.renderer]
  unsafe = true

[params]
  author = "Leetaek"
  description = "iOS 개발을 하며 배운 것과 만든 것을 기록합니다."
  defaultTheme = "auto"
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  [params.homeInfoParams]
    Title = "iOS 개발 기록"
    Content = """
iOS 개발을 하며 배운 것과 만든 것을 기록합니다.

2026년 11월 이전 글은 [Tistory](https://leetaek.tistory.com/) 에 있습니다.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/leetaek"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "/archives/"
    weight = 20

  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30

  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 50
